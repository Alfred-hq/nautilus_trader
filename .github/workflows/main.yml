
name: Build and Push Docker Images

on:
  push:
    branches:
      - master-production
      - releases_production

        

env:
  REGISTRY: ghcr.io
jobs:
  build_and_push_images:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'write'
      id-token: 'write'
    steps:
      - name: Derive latest image name
        id: branch-name
        run: |
          name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
          echo "BRANCH_NAME=$name" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Depot
        uses: depot/setup-action@v1

      - name: Log in to Docker Hub
        uses:  docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALFRED_FLOW_DOCKER_USERNAME }}
          password: ${{ secrets.ALFRED_FLOW_DOCKER_PASSWORD }}

      - name: Get commit hash
        id: get_commit_hash
        run: echo "::set-output name=hash::$(git rev-parse --short HEAD)"


      - name: Build and Push Nautilus Docker Images
        run: |
          branch_name="${{steps.branch-name.outputs.BRANCH_NAME}}"
          cd ./
          docker build -t ${{ env.REGISTRY }}/alfred-hq/nautilus-build-${branch_name}:${{ steps.get_commit_hash.outputs.hash }} -t ${{ env.REGISTRY }}/alfred-hq/nautilus-build-${branch_name}:latest -f nautilus_trader.Dockerfile .  || exit 1
          docker push ${{ env.REGISTRY }}/alfred-hq/nautilus-build-${branch_name}:${{ steps.get_commit_hash.outputs.hash }} || exit 1
          docker push ${{ env.REGISTRY }}/alfred-hq/nautilus-build-${branch_name}:latest || exit 1

